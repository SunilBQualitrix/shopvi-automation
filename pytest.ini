[pytest]
bdd_features_base_dir = tests/features
addopts = --html=artifacts/reports/report.html --self-contained-html --alluredir=artifacts/allure-results
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning

log_cli = true
log_cli_level = CRITICAL
log_cli_format = %(message)s

